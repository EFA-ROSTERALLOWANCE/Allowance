<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="EFA EA 2025 duty / allowance calculator.">
<title>EFA Duty Allowance Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f4f5f7; color: #1a1f2c; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  body { min-height: 100vh; min-height: 100dvh; }
  #root { min-height: 100vh; min-height: 100dvh; }
  input, select, textarea, button { font-size: 16px; font-family: inherit; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #6b7280; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; z-index: 9999; }
  #loading.gone { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="loading">Loading…</div>
<script>
(function(){
  var observer = new MutationObserver(function(){
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      var l = document.getElementById('loading');
      if (l) l.classList.add('gone');
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  setTimeout(function(){ var l = document.getElementById('loading'); if (l) l.classList.add('gone'); }, 5000);
})();
</script>

Choose the pay year","The EBA year selector applies the right indexation to every rate. When you upload a roster it's set automatically from the bid period's start date \u2014 and updates as you click between BP chips \u2014 so you usually don't need to touch it. You can still pick a year to project."],["Upload your roster","Tap \u{1F4C4} ROSTER and choose your Qantas SH bid-period .txt file. You can upload several BP files one after another to view multiple bid periods together \u2014 boundary trips that span two BPs are handled for you."],["Use a roster from after the BP ends","Important: download the BP file once the bid period has finished. Only then does it carry the live (actual) block and duty times that payroll pays from \u2014 a roster downloaded before or during the BP still shows planned times, so its credit hours, ADD HR PAY, duty hours and meals won't match your payslip. Check the print date at the top right of the file: it should be after the BP's last day."],["DAY SUMMARY tab","The row of day buttons across the top is one week (use \u2039 \u203A to change week); each shows the date, the route flown and that day's allowance total. Tap a day to see its sectors \u2014 flight, ports and sign-on/sign-off times \u2014 plus any hotel with its check-in and check-out, and extras such as accommodation opt-out nights or an extra day-off payment. Everything is editable, so you can also build a day by hand. Below that, the results split the day's DHA and meals (breakfast, lunch, dinner, incidentals) by calendar date, show which meals each date covers, and tag anything carried in from a trip that started on another day. On the day a multi-day trip starts, a whole-trip total is shown too."],["MEAL RATES tab","The EA meal allowance schedule (Cl. 6.22\u20136.24): every airport with the meal zone it falls in, and the breakfast, lunch, dinner and incidental rates for each zone. Pick a rate period from the selector to see the rates that applied at a given time \u2014 use it to check the rate behind any meal line."],["WEEK SUMMARY tab","One row per day of the current week with that day's allowances \u2014 tap a row to open it in DAY SUMMARY. Underneath are the week's total and a breakdown by allowance type."],["MONTH / ROSTER tab \u2014 the totals","Click a BP chip (e.g. \u201CBP 3761\u201D) to show that whole bid period, or use the month picker for a calendar month. The heading shows the dates and, for a BP, the Qantas roster header's carried-in/out duty and credit. The big card is the total allowances for the period \u2014 including ADD HR PAY when a BP is selected \u2014 followed by every pattern (tap one to open it in DAY SUMMARY) and a breakdown by allowance type. A BP shows the same total whether it's loaded on its own or alongside its neighbour."],["MONTH / ROSTER tab \u2014 the detail","Further down, each section lists line items: DHA allowances (one line per duty with its hours), trip totals (one line per hotel stay, which is how payroll pays meals \u2014 in the BP the pattern signed on in), every meal and incidental payment, and credit hours per sector or duty with the credit total. For a BP, ROSTER VIEW at the bottom shows the raw roster file. Expand any section to see how each figure is built, and use Export CSV to save a copy."],["ADD HR PAY & Years of Service","If a BP's credit is over 70 hours, the credit section shows ADD HR PAY: hours over 70 \xD7 (salary \xF7 750). The salary depends on your years of service, filled in from the pilot list when your name is found \u2014 otherwise pick it. Captains are asked to confirm it, in a banner at the top of MONTH / ROSTER and in the ADD HR PAY panel: if you were upgraded from F/O your captain years of service restart at the upgrade, so the auto-set value (from your joining date) would overstate ADD HR PAY against your payslip."],["Or use a custom range","Set the Custom range dates for any window you like. Custom ranges show just the allowances captured in those dates \u2014 ADD HR PAY and the Qantas header duty/credit carry are deliberately excluded."],["PAY CHECK tab","PAY CHECK compares what you were actually paid against the figures above. Tap \u{1F4C4} Upload payslip PDF and the earnings lines are read straight off it \u2014 CR MEALS ATO, DUTY HOUR AL, call-ins, DVA, ADD HR PAY and CANCEL ACCOM \u2014 and the matching bid period is selected for you. The PDF is read inside your browser and is never uploaded anywhere."],["Or enter it by hand","No PDF, or a payslip it can't read? Select a BP chip and type the lines in yourself. \u201CPre-fill from this roster\u201D adds a meal line per hotel stay with the dates already filled, so you only type the amounts. Anything read from a PDF stays editable."],["Reading the result","Every line shows the calculator's own figure beside yours, with a \u2713 or the dollar difference. The headline is the total variance. It also flags a stay with no matching payslip line \u2014 an unpaid trip \u2014 and a payment the calculator says you weren't owed. A difference is a prompt to check, not proof of an error: these are estimates."],["Housekeeping","\u2913 APP saves a standalone offline copy of the calculator, \u263E toggles dark mode, and \u{1F5D1} CLEAR removes all loaded roster and payslip data and resets everything. On PAY CHECK, \u{1F5D1} CLEAR PAYSLIP drops just the payslip figures and keeps your roster. Nothing is saved between sessions \u2014 it all clears when you reload."]];return(0,o.jsx)("div",{onClick:t,style:{position:"fixed",inset:0,zIndex:9e3,background:"rgba(20,24,32,0.55)",display:"flex",alignItems:"center",justifyContent:"center",padding:16},children:(0,o.jsxs)("div",{onClick:a=>a.stopPropagation(),style:{background:"var(--bg)",border:"1px solid var(--accentLine)",borderRadius:16,maxWidth:640,width:"100%",maxHeight:"calc(100dvh - 32px)",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"},children:[(0,o.jsxs)("div",{style:{display:"flex",alignI         /* Responsive \u2014 the top bar
           Three groups, in this order: brand, controls (role / aircraft / EBA
           index), actions (clock, ROSTER, APP, CLEAR, theme, help). The bar
           wraps, so each group has to survive being pushed onto its own line:
             - .topbar-controls keeps flex-basis auto, NOT 0. With flex:1 the
               basis is 0, so on a narrow screen the group collapses to a thin
               column and stacks its five controls vertically in the middle of
               the bar (iPad portrait did exactly that). It still grows to fill
               a wide bar, it just never shrinks below its content.
             - .topbar-actions groups the buttons so they move as one and stay
               right-aligned, instead of individually orphaning onto a new line.
             - .seg keeps a segmented pair (Captain/F/Officer, A330/A320)
               together when the controls row itself wraps. */
        .topbar{background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 12px;padding:0 20px;min-height:52px;flex-wrap:wrap;}
        .stickyhead{position:sticky;top:0;z-index:50;}
        .topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
        .topbar-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;}
        .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
        .seg{display:flex;align-items:center;gap:8px;}
        .tabbar{background:var(--bg);border-bottom:1px solid var(--line);display:flex;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
        .day-tabs{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:5px;overflow-x:auto;align-items:stretch;-webkit-overflow-scrolling:touch;}
        .hotel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:12px;align-items:end;}
        .summary-row{display:grid;grid-template-columns:125px 1fr auto;}
        .monthly-row{display:grid;grid-template-columns:160px 1fr auto;}
        .rates-grid{display:grid;grid-template-columns:155px repeat(4,1fr);}
        .type-breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px;}
        .main-content{max-width:980px;margin:0 auto;padding:16px 20px;}

        @media(max-width:768px){
          /* Phone: one group per line, all left-aligned. */
          .topbar{padding:8px 12px;gap:8px;min-height:auto;flex-wrap:wrap;}
          .topbar-brand{order:0;flex:1 0 100%;}
          .topbar-controls{order:1;flex:1 0 100%;justify-content:flex-start;}
          .topbar-actions{order:2;flex:1 0 100%;justify-content:flex-start;margin-left:0;}
          .tabbar{padding:0 12px;}
          .day-tabs{padding:8px 8px;gap:4px;}
          .day-tabs .dpill{min-width:62px!important;padding:6px 8px!important;}
          .hotel-grid{grid-template-columns:1fr!important;gap:8px!important;}
          .hotel-grid>div:nth-child(2){flex-direction:row!important;justify-content:center!important;}
          .summary-row{grid-template-columns:1fr!important;}
          .monthly-row{grid-template-columns:1fr!important;}
          .rates-grid{grid-template-columns:1fr!important;}
          .type-breakdown{grid-template-columns:1fr!important;}
          .main-content{padding:12px 10px;}
        }
        @media(min-width:769px) and (max-width:1024px){
          /* Tablet portrait: two tidy rows \u2014 brand with the action buttons
             ranged right, then the controls on their own full-width line. */
          .topbar{flex-wrap:wrap;padding:8px 16px;gap:8px 10px;min-height:auto;}
          .topbar-brand{order:0;}
          .topbar-actions{order:1;}
          .topbar-controls{order:2;flex:1 0 100%;}
          .tabbar{padding:0 16px;}
          .day-tabs .dpill{min-width:72px!important;}
          .main-content{padding:16px 16px;}
        }
