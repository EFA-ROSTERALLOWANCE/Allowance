<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="EFA EA 2025 duty / allowance calculator.">
<title>EFA Duty Allowance Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f4f5f7; color: #1a1f2c; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  body { min-height: 100vh; min-height: 100dvh; }
  #root { min-height: 100vh; min-height: 100dvh; }
  input, select, textarea, button { font-size: 16px; font-family: inherit; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #6b7280; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; z-index: 9999; }
  #loading.gone { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="loading">Loading…</div>
<script>
(function(){
  var observer = new MutationObserver(function(){
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      var l = document.getElementById('loading');
      if (l) l.classList.add('gone');
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  setTimeout(function(){ var l = document.getElementById('loading'); if (l) l.classList.add('gone'); }, 5000);
})();
</script>

        .stickyhead{position:sticky;top:0;z-index:50;}
        .topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
        .topbar-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;}
        .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
        .seg{display:flex;align-items:center;gap:8px;}
        .tabbar{background:var(--bg);border-bottom:1px solid var(--line);display:flex;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

        .hotel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:12px;align-items:end;}

        .monthly-row{display:grid;grid-template-columns:160px 1fr auto;}
        .rates-grid{display:grid;grid-template-columns:155px repeat(4,1fr);}

          .day-tabs{padding:8px 8px;gap:4px;}

          .monthly-row{grid-template-columns:1fr!important;}

          .type-breakdown{grid-template-columns:1fr!important;}

          .tabbar{padding:0 16px;}
          .day-tabs .dpill{min-width:72px!important;}
          .main-content{padding:16px 16px;}
        }
